name: Build Release Tarball

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')

          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "Tag version does not match DESCRIPTION version"
            exit 1
          }

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Build package
        run: |
          R CMD build .

      - name: Prepare release assets
        id: assets
        run: |
          TARBALL=$(ls -1 *.tar.gz | head -1)
          COMMENTS="cran-comments-${GITHUB_REF_NAME}.md"

          mkdir release-assets
          cp "$TARBALL" "release-assets/$TARBALL"

          {
            printf "<!-- Generated for %s -->\n\n" "$GITHUB_REF_NAME"
            cat cran-comments.md
          } > "release-assets/$COMMENTS"

          echo "tarball=release-assets/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "comments=release-assets/$COMMENTS" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            ${{ steps.assets.outputs.tarball }}
            ${{ steps.assets.outputs.comments }}